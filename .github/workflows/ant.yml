name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download JUnit Libraries
      run: |
        wget -O junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        wget -O hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Compile Code
      run: javac -cp .:junit.jar:hamcrest.jar module03/*.java

    - name: Run Tests
      run: java -cp .:junit.jar:hamcrest.jar org.junit.runner.JUnitCore module03.HongkunTest
